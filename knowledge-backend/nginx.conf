worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=knowledge_auth:10m rate=5r/s;

    upstream knowledge-api {
        zone knowledge_api 64k;
        resolver 127.0.0.11 ipv6=off valid=5s;
        least_conn;
        server api:8081 resolve max_fails=1 fail_timeout=3s;
        server api-secondary:8081 resolve max_fails=1 fail_timeout=3s;
        keepalive 64;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        client_body_timeout 10s;
        proxy_connect_timeout 1s;
        proxy_read_timeout 65s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

        location ~ ^/api/knowledge/auth/(register|login)$ {
            limit_req zone=knowledge_auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://knowledge-api;
        }

        location ~ ^/api/knowledge/(workspaces/[^/]+/)?(documents/[^/]+/)?ask/stream$ {
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 90s;
            proxy_pass http://knowledge-api;
        }

        location ~ ^/api/knowledge/(workspaces/[^/]+/)?(documents/[^/]+/)?(search|ask)$ {
            proxy_next_upstream error timeout http_502 http_504 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 4s;
            proxy_pass http://knowledge-api;
        }

        location ~ ^/api/knowledge/(workspaces/[^/]+/)?documents/[^/]+/versions/pdf$ {
            client_max_body_size 26m;
            proxy_pass http://knowledge-api;
        }

        location /api/knowledge/ {
            proxy_pass http://knowledge-api;
        }

        location = /health/ready {
            proxy_pass http://knowledge-api/actuator/health/readiness;
        }

        location = / {
            expires -1;
        }

        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        location ^~ /assets/ {
            expires 365d;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
