global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 2s
    timeout client  1h
    timeout server  1h
    timeout check   1s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 3s

frontend knowledge-postgres
    bind :5432
    default_backend primary

frontend readiness
    bind 127.0.0.1:8404
    mode http
    monitor-uri /ready
    monitor fail if { nbsrv(primary) lt 1 }

backend primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008
