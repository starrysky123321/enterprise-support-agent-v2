server:
  address: 127.0.0.1
  port: 8081
  shutdown: graceful
  tomcat:
    threads:
      max: ${KNOWLEDGE_HTTP_THREADS:96}
    accept-count: 128
    max-connections: 1024
spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
      file-size-threshold: 0
  data:
    redis:
      host: ${KNOWLEDGE_REDIS_HOST:127.0.0.1}
      port: ${KNOWLEDGE_REDIS_PORT:6379}
      password: ${KNOWLEDGE_REDIS_PASSWORD:}
      connect-timeout: 250ms
      timeout: 250ms
  datasource:
    url: ${KNOWLEDGE_DATABASE_URL}
    username: ${KNOWLEDGE_DATABASE_USER}
    password: ${KNOWLEDGE_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${KNOWLEDGE_SQL_POOL_SIZE:16}
      minimum-idle: 2
      connection-timeout: 1500
  flyway:
    schemas: knowledge_backend
  kafka:
    bootstrap-servers: ${KNOWLEDGE_KAFKA_BOOTSTRAP:127.0.0.1:9092}
    admin:
      auto-create: ${KNOWLEDGE_KAFKA_ENABLED:false}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 1500
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 180000
    listener:
      ack-mode: record
  lifecycle:
    timeout-per-shutdown-phase: 65s
management:
  health:
    redis:
      enabled: ${KNOWLEDGE_RATE_LIMIT_ENABLED:false}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
knowledge:
  api-token: ${KNOWLEDGE_API_TOKEN}
  index-token: ${KNOWLEDGE_INDEX_TOKEN}
  index-url: ${KNOWLEDGE_INDEX_URL:http://127.0.0.1:8011}
  worker-concurrency: ${KNOWLEDGE_WORKER_CONCURRENCY:4}
  max-attempts: ${KNOWLEDGE_MAX_ATTEMPTS:1}
  kafka-enabled: ${KNOWLEDGE_KAFKA_ENABLED:false}
  kafka-partitions: ${KNOWLEDGE_KAFKA_PARTITIONS:12}
  kafka-replicas: ${KNOWLEDGE_KAFKA_REPLICAS:1}
  search-concurrency: ${KNOWLEDGE_SEARCH_CONCURRENCY:32}
  ask-concurrency: ${KNOWLEDGE_ASK_CONCURRENCY:6}
  pdf-upload-concurrency: ${KNOWLEDGE_PDF_UPLOAD_CONCURRENCY:4}
  pdf-storage:
    mode: ${KNOWLEDGE_PDF_STORAGE_MODE:database}
    directory: ${KNOWLEDGE_PDF_STORAGE_DIR:./data/knowledge-blobs}
  search-cache:
    enabled: ${KNOWLEDGE_SEARCH_CACHE_ENABLED:false}
    ttl-seconds: ${KNOWLEDGE_SEARCH_CACHE_TTL_SECONDS:30}
    max-entries: ${KNOWLEDGE_SEARCH_CACHE_MAX_ENTRIES:512}
    revision: ${KNOWLEDGE_SEARCH_CACHE_REVISION:default}
  rate-limit:
    enabled: ${KNOWLEDGE_RATE_LIMIT_ENABLED:false}
    search:
      per-minute: ${KNOWLEDGE_SEARCH_RATE_PER_MINUTE:60000}
      burst: ${KNOWLEDGE_SEARCH_BURST:1000}
    ask:
      per-minute: ${KNOWLEDGE_ASK_RATE_PER_MINUTE:7200}
      burst: ${KNOWLEDGE_ASK_BURST:120}
